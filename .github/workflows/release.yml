name: Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android packages
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG=${GITHUB_REF#refs/tags/}
            RELEASE_TITLE="Release $RELEASE_TAG"
            RELEASE_NOTES="Auto-built debug APK from $RELEASE_TAG"
          else
            RELEASE_TAG="auto-${GITHUB_SHA::8}"
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
            RELEASE_TITLE="Auto release from master ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            RELEASE_NOTES="Auto-built debug APK from master commit ${GITHUB_SHA::8}"
          fi
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --repo "$GITHUB_REPOSITORY" \
            app/build/outputs/apk/debug/kdeconnect-android-debug.apk
